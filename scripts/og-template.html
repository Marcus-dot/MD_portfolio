<!doctype html>
<!--
  Share image (public/og.png, 1200x630). The statue is drawn from the baked
  cell map with the same tile-and-glyph language as the site. It must be
  served from the site's origin so the canvas can read /statue/marcus.png:
    cp scripts/og-template.html public/og-template.html   (temporarily)
    then screenshot http://localhost:4321/og-template.html at 1200x630
    and delete public/og-template.html again.
-->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@600;700&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; background: #0A0A0B; overflow: hidden; position: relative;
    font-family: 'Inter Tight', sans-serif; color: #F2F4EC;
  }
  .text { position: absolute; left: 72px; bottom: 64px; z-index: 2; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace; font-size: 19px; letter-spacing: 0.2em;
    color: #9AA394; margin-bottom: 26px;
  }
  h1 {
    font-size: 124px; font-weight: 700; line-height: 0.92; letter-spacing: -0.045em;
    text-transform: uppercase;
  }
  h1 em { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; color: #9BC97E; text-transform: none; }
  .sub { margin-top: 26px; font-size: 29px; color: #9AA394; }
  .sub em { font-family: 'Instrument Serif', serif; font-style: italic; color: #F2F4EC; }
  canvas { position: absolute; right: 30px; bottom: 0; width: 520px; height: 600px; }
  .credit {
    position: absolute; right: 36px; top: 30px; text-align: right;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.7;
    letter-spacing: 0.12em; color: #767F6D;
  }
  /* registration marks, as on the site's nav */
  .mark { position: absolute; width: 16px; height: 16px; border-color: #3a4036; border-style: solid; border-width: 0; }
  .tl { left: 24px; top: 24px; border-top-width: 1px; border-left-width: 1px; }
  .tr { right: 24px; top: 24px; border-top-width: 1px; border-right-width: 1px; }
  .bl { left: 24px; bottom: 24px; border-bottom-width: 1px; border-left-width: 1px; }
  .br { right: 24px; bottom: 24px; border-bottom-width: 1px; border-right-width: 1px; }
</style>
</head>
<body>
  <span class="mark tl"></span><span class="mark tr"></span><span class="mark bl"></span><span class="mark br"></span>
  <canvas id="c" width="1040" height="1200"></canvas>
  <div class="credit">MARCUS AURELIUS · MARBLE, 161–169 CE · MAH GENEVA<br>3D SCAN BY RAMA, WIKIMEDIA COMMONS, CC BY-SA 3.0 FR</div>
  <div class="text">
    <div class="eyebrow">SOFTWARE ENGINEER · LUSAKA, ZAMBIA</div>
    <h1>Madalitso<br>Daka<em>.</em></h1>
    <div class="sub">Software that <em>holds up in production.</em></div>
  </div>
<script>
(async () => {
  await document.fonts.ready;
  const img = await createImageBitmap(await (await fetch("/statue/marcus.png")).blob(), { colorSpaceConversion: "none" });
  const src = document.createElement("canvas"); src.width = img.width; src.height = img.height;
  const sctx = src.getContext("2d"); sctx.drawImage(img, 0, 0);
  const px = sctx.getImageData(0, 0, img.width, img.height).data;
  const W = img.width, H = img.height;
  // crop to lit cells
  let x0 = W, y0 = H, x1 = 0, y1 = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (px[(y * W + x) * 4 + 2]) {
    x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
  }
  const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
  const c = document.getElementById("c"), ctx = c.getContext("2d");
  const cell = Math.min(c.width / cw, c.height / ch);
  const ox = (c.width - cw * cell) / 2, oy = c.height - ch * cell;
  const L = (() => { const v = [-0.55, 0.55, 0.75]; const m = Math.hypot(...v); return v.map(a => a / m); })();
  const hv = (() => { const v = [L[0], L[1], L[2] + 1]; const m = Math.hypot(...v); return v.map(a => a / m); })();
  const lerp = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const DARK = [20, 26, 19], MID = [111, 123, 101], BONE = [238, 240, 230];
  const GLYPHS = "+:=*#%o.";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = `600 ${Math.round(cell * 0.92)}px 'JetBrains Mono', monospace`;
  const gap = Math.max(1, cell * 0.1);
  for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
    const o = ((y + y0) * W + x + x0) * 4;
    const tone = px[o + 2] / 255; if (!tone) continue;
    const nx = (px[o] - 128) / 127, ny = (px[o + 1] - 128) / 127, nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));
    const d = Math.max(0, nx * L[0] + ny * L[1] + nz * L[2]);
    const s = Math.max(0, nx * hv[0] + ny * hv[1] + nz * hv[2]);
    const v = Math.min(1, tone * (0.14 + 0.86 * d) + Math.pow(s, 28) * 0.55 * tone);
    if (v < 0.04) continue;
    const base = v < 0.45 ? lerp(DARK, MID, v / 0.45) : lerp(MID, BONE, (v - 0.45) / 0.55);
    const ink = v > 0.55 ? lerp(base, DARK, 0.42) : lerp(base, BONE, 0.22);
    const X = ox + x * cell, Y = oy + y * cell;
    ctx.fillStyle = `rgb(${base})`; ctx.fillRect(X + gap / 2, Y + gap / 2, cell - gap, cell - gap);
    ctx.fillStyle = `rgb(${ink})`;
    ctx.fillText(GLYPHS[((y * cw + x) * 2654435761 >>> 0) % GLYPHS.length], X + cell / 2, Y + cell / 2 + cell * 0.04);
  }
  document.body.dataset.ready = "1";
})();
</script>
</body>
</html>
